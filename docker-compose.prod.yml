services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgresdb
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pgnetwork

  redis-db:
    image: redis:7-alpine
    container_name: redisdb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - pgnetwork

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.15.1
    container_name: umami
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: 1
      ALLOWED_FRAME_ANCESTORS: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${UMAMI_PORT:-3002}:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pgnetwork

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-backend:latest}
    build:
      context: ./backend
      target: production
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
    command: sh -c "npx prisma migrate deploy && npx tsx src/index.ts"
    ports:
      - "3001:3001"
    depends_on:
      - postgres-db
      - redis-db
    restart: unless-stopped
    networks:
      - pgnetwork

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-frontend:latest}
    build:
      context: ./frontend
      target: production
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-/api}
      NUXT_PUBLIC_UMAMI_URL: ${PUBLIC_UMAMI_URL:-/umami}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      NUXT_PUBLIC_UMAMI_ENABLED: ${UMAMI_ENABLED:-true}
    depends_on:
      - backend
      - umami
    restart: unless-stopped
    networks:
      - pgnetwork

networks:
  pgnetwork:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  umami-db-data:
    driver: local
