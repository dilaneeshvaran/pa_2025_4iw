services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgresdb
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pgnetwork

  redis-db:
    image: redis:7-alpine
    container_name: redisdb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - pgnetwork

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-backend:latest}
    build:
      context: ./backend
      target: production
    container_name: backend
    env_file:
      - ./backend/.env
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "3001:3001"
    depends_on:
      - postgres-db
      - redis-db
    restart: unless-stopped
    networks:
      - pgnetwork

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-frontend:latest}
    build:
      context: ./frontend
      target: production
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      # NUXT_PUBLIC_API_BASE overrides runtimeConfig.public.apiBase at runtime
      # Use localhost so the browser can reach the backend via the exposed port
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pgnetwork

networks:
  pgnetwork:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
