services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgresdb-dev
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BACKEND_POSTGRES_USER} -d ${BACKEND_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-db:
    image: redis:7-alpine
    container_name: redisdb-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  umami-db-dev:
    image: postgres:16-alpine
    container_name: umami-db-dev
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_dev_password}
    volumes:
      - umami-db-data-dev:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  umami-dev:
    image: ghcr.io/umami-software/umami:postgresql-v2.15.1
    container_name: umami-dev
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami_dev_password}@umami-db-dev:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-dev_app_secret_change_in_prod}
      DISABLE_TELEMETRY: 1
    ports:
      - "${UMAMI_PORT:-3002}:3000"
    depends_on:
      umami-db-dev:
        condition: service_healthy
    networks:
      - pgnetwork

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_DATABASE_URL: postgresql://admin:admin@postgresdb-dev:5432/medicote?schema=public
      BACKEND_REDIS_URL: redis://redisdb-dev:6379
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npx prisma generate --schema=/app/backend/prisma/schema.prisma && npx prisma db push --schema=/app/backend/prisma/schema.prisma && npm run dev"
    ports:
      - "3001:3001"
    volumes:
      - ./backend/.env:/app/backend/.env:ro
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    networks:
      - pgnetwork

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api
      NUXT_PUBLIC_UMAMI_URL: http://localhost:3002
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      NUXT_PUBLIC_UMAMI_ENABLED: ${UMAMI_ENABLED:-true}
      NUXT_HMR_HOST: localhost
      NUXT_HMR_CLIENT_PORT: "3000"
      NUXT_VITE_USE_POLLING: "true"
      NUXT_VITE_POLLING_INTERVAL: "250"
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.nuxt
    depends_on:
      - backend
      - umami-dev
    networks:
      - pgnetwork

networks:
  pgnetwork:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
  redis-data-dev:
    driver: local
  umami-db-data-dev:
    driver: local
