services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgresdb-dev
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_POSTGRES_USER} -d ${BACKEND_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-db:
    image: redis:7-alpine
    container_name: redisdb-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_DATABASE_URL: postgresql://admin:admin@postgresdb-dev:5432/medicote?schema=public
      BACKEND_REDIS_URL: redis://redisdb-dev:6379
    command: sh -c "npx prisma db push && npm run dev"
    ports:
      - "3001:3001"
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - /app/node_modules
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    networks:
      - pgnetwork

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    networks:
      - pgnetwork

networks:
  pgnetwork:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
  redis-data-dev:
    driver: local
