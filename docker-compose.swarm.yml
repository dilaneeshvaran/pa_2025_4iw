services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB:-medicote}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER:-admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d medicote"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - postgres_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

  redis-db:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - umami_db_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:postgresql-v2.15.1}
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
      ALLOWED_FRAME_ANCESTORS: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${UMAMI_PORT:-3010}:3000"
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - ./backend/.env
    environment:
      BACKEND_PORT: 3001
      BACKEND_HOST: 0.0.0.0
      BACKEND_NODE_ENV: production
      BACKEND_DATABASE_URL: postgresql://admin:admin@postgres-db:5432/medicote?schema=public
      BACKEND_REDIS_URL: redis://redis-db:6379
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      BACKEND_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      BACKEND_JWT_SECRET_FILE: /run/secrets/jwt_secret
      BACKEND_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - postgres_password
      - jwt_secret
      - encryption_key
    entrypoint:
      - sh
      - -c
      - |
        export BACKEND_POSTGRES_PASS=$$(cat /run/secrets/postgres_password)
        export BACKEND_JWT_SECRET=$$(cat /run/secrets/jwt_secret)
        export BACKEND_ENCRYPTION_KEY=$$(cat /run/secrets/encryption_key)
        export BACKEND_DATABASE_URL=postgresql://admin:$${BACKEND_POSTGRES_PASS}@postgres-db:5432/medicote?schema=public
        npx prisma migrate deploy && npx tsx src/index.ts
    depends_on:
      - postgres-db
      - redis-db
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  livekit:
    image: livekit/livekit-server:v1.8.3
    command:
      - --config
      - /etc/livekit/livekit.yaml
    configs:
      - source: livekit_config
        target: /etc/livekit/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-/api}
      NUXT_PUBLIC_UMAMI_URL: ${PUBLIC_UMAMI_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      NUXT_PUBLIC_UMAMI_ENABLED: ${UMAMI_ENABLED:-true}
      NUXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_WS_URL:-}
    depends_on:
      - backend
      - umami
      - livekit
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  nginx:
    image: ${NGINX_IMAGE}
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
      - umami
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure

  portainer:
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:lts}
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  pgnetwork:
    driver: overlay
    attachable: true

configs:
  livekit_config:
    external: true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  umami-db-data:
    driver: local
  backend-uploads:
    driver: local
  portainer-data:
    driver: local

secrets:
  postgres_password:
    external: true
  umami_db_password:
    external: true
  umami_app_secret:
    external: true
  jwt_secret:
    external: true
  encryption_key:
    external: true
