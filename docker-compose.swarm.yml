services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BACKEND_POSTGRES_DB:-medicote}
      POSTGRES_USER: ${BACKEND_POSTGRES_USER:-admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d medicote"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - postgres_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        # `any`, not `on-failure`: a clean SIGTERM (reboot, daemon restart,
        # redeploy) exits 0, which `on-failure` treats as success and never
        # restarts — leaving the DB dead at 0/1 and cascading to backend/nginx.
        condition: any
        delay: 5s

  redis-db:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        # See postgres-db: a clean exit (0) must still restart a long-running DB.
        condition: any
        delay: 5s

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - umami_db_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        # See postgres-db: a clean exit (0) must still restart a long-running DB.
        condition: any
        delay: 5s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.15.1
    # Use the image's default entrypoint; pass config via env (umami DB password
    # and APP_SECRET come from the root .env). The previous custom entrypoint
    # called a non-existent /entrypoint.sh and exited 127.
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
      ALLOWED_FRAME_ANCESTORS: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-backend:latest}
    # Provides every non-secret var (Resend, Google OAuth, JWT refresh, Stripe...).
    # The entrypoint below re-exports the sensitive ones from Docker secrets,
    # which therefore take precedence over anything in this file.
    env_file:
      - ./backend/.env
    environment:
      BACKEND_PORT: 3001
      BACKEND_HOST: 0.0.0.0
      BACKEND_NODE_ENV: production
      BACKEND_DATABASE_URL: postgresql://admin:admin@postgres-db:5432/medicote?schema=public
      BACKEND_REDIS_URL: redis://redis-db:6379
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      BACKEND_JWT_SECRET_FILE: /run/secrets/jwt_secret
      BACKEND_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - postgres_password
      - jwt_secret
      - encryption_key
    entrypoint:
      - sh
      - -c
      - |
        export BACKEND_POSTGRES_PASS=$$(cat /run/secrets/postgres_password)
        export BACKEND_JWT_SECRET=$$(cat /run/secrets/jwt_secret)
        export BACKEND_ENCRYPTION_KEY=$$(cat /run/secrets/encryption_key)
        export BACKEND_DATABASE_URL=postgresql://admin:$${BACKEND_POSTGRES_PASS}@postgres-db:5432/medicote?schema=public
        npx prisma migrate deploy && npx tsx src/index.ts
    depends_on:
      - postgres-db
      - redis-db
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-frontend:latest}
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-/api}
      NUXT_PUBLIC_UMAMI_URL: ${PUBLIC_UMAMI_URL:-/umami}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      NUXT_PUBLIC_UMAMI_ENABLED: ${UMAMI_ENABLED:-true}
    depends_on:
      - backend
      - umami
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/dilaneeshvaran/pa_2025_4iw-nginx:latest}
    # TLS is terminated by the host nginx + certbot, which forwards to this
    # service on 8080. The swarm nginx only does HTTP routing (/, /api, /umami).
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
      - umami
    networks:
      - pgnetwork
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure

networks:
  pgnetwork:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  umami-db-data:
    driver: local
  backend-uploads:
    driver: local
    
secrets:
  postgres_password:
    external: true
  umami_db_password:
    external: true
  umami_app_secret:
    external: true
  jwt_secret:
    external: true
  encryption_key:
    external: true
