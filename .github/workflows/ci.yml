name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install in isolation, exactly like the Docker build context (which only
      # contains ./backend). Removing the root workspace manifests prevents npm
      # from hoisting to the monorepo root, so backend's package-lock.json and
      # its `overrides` (e.g. bullmq -> single ioredis) are honoured.
      - name: Isolate workspace
        working-directory: .
        run: rm -f package.json package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Type-check & build
        run: npm run build

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Isolate from the monorepo root so npm uses frontend/package-lock.json
      # and does not hoist to the workspace root (mirrors the Docker build).
      - name: Isolate workspace
        working-directory: .
        run: rm -f package.json package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
