name: CI

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Install from the monorepo root with workspaces intact (mirrors the
      # Dockerfile). This is what resolves the @medicote/shared workspace that
      # the backend depends on; legacy-peer-deps (.npmrc) clears the
      # @ts-rest/fastify peer mismatch with fastify@5.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run tests
        run: npm test --workspace=backend

      - name: Type-check & build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  ci-gate:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Success
        run: echo "All build and test stages completed successfully!"
