name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded PR runs, but never cancel a deploy in progress.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ── CI: single install → parallel tests ───────────────────────────────────
  # One checkout + one npm install shared across all test steps.
  # The Docker build-and-push stage handles its own install/compile inside the
  # Dockerfile, so we skip redundant bare `npm run build` steps here.
  ci:
    name: Install, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is generated on Windows and lacks linux-x64-gnu/musl
      # optional native binaries (e.g. oxc-parser used by Nuxt).
      # Removing it forces a fresh cross-platform resolution.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      # Run backend and frontend tests in parallel within the same job.
      - name: Test backend
        run: npm test --workspace=backend

      - name: Test frontend
        run: npm test --workspace=frontend

  # ── CD: build images + deploy (only on push to main) ─────────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # backend/frontend build from the repo root (Dockerfiles COPY root
          # manifests + the shared/ workspace), targeting the production stage.
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
            target: production
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
            target: production
          # swarm reverse proxy (single-stage image, no target).
          - service: nginx
            context: infrastructure/nginx
            dockerfile: infrastructure/nginx/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Ship the swarm stack file + the observability configs it bind-mounts.
      # The .env files (root + backend/.env) and Docker secrets live on the VPS.
      - name: Copy stack files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.swarm.yml,infrastructure"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy swarm stack on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # Use a long-lived PAT (read:packages), not the ephemeral GITHUB_TOKEN:
            # --with-registry-auth ships this credential to swarm for ongoing
            # image pulls (restarts/rescheduling), and GITHUB_TOKEN expires ~1h
            # after the run, breaking later pulls with "No such image".
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            # Load the root .env so ${...} vars in the stack file are interpolated.
            set -a; [ -f .env ] && . ./.env; set +a
            docker stack deploy -c docker-compose.swarm.yml --with-registry-auth --prune medicote
            docker image prune -f
