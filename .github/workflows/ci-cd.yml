name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded PR runs, but never cancel a deploy in progress.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ── CI: tests + build ─────────────────────────────────────────────────────
  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Install from the monorepo root with workspaces intact (mirrors the
      # Dockerfile) so the @medicote/shared workspace resolves; legacy-peer-deps
      # (.npmrc) clears the @ts-rest/fastify peer mismatch with fastify@5.
      # npm install (not ci) is required because the lockfile is generated on
      # Windows and lacks linux-x64 native binaries (e.g. oxc-parser).
      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run tests
        run: npm test --workspace=backend

      - name: Type-check & build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm install (not ci) resolves linux-x64 native binaries missing from the
      # Windows-generated lockfile (e.g. oxc-parser used by Nuxt).
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  ci-gate:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Success
        run: echo "All build and test stages completed successfully!"

  # ── CD: build images + deploy (only on push to main) ─────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # backend/frontend build from the repo root (Dockerfiles COPY root
          # manifests + the shared/ workspace), targeting the production stage.
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
            target: production
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
            target: production
          # swarm reverse proxy (single-stage image, no target).
          - service: nginx
            context: infrastructure/nginx
            dockerfile: infrastructure/nginx/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Ship the swarm stack file + the observability configs it bind-mounts.
      # The .env files (root + backend/.env) and Docker secrets live on the VPS.
      - name: Copy stack files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.swarm.yml,infrastructure"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy swarm stack on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # Use a long-lived PAT (read:packages), not the ephemeral GITHUB_TOKEN:
            # --with-registry-auth ships this credential to swarm for ongoing
            # image pulls (restarts/rescheduling), and GITHUB_TOKEN expires ~1h
            # after the run, breaking later pulls with "No such image".
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            # Load the root .env so ${...} vars in the stack file are interpolated.
            set -a; [ -f .env ] && . ./.env; set +a
            docker stack deploy -c docker-compose.swarm.yml --with-registry-auth --prune medicote
            docker image prune -f
