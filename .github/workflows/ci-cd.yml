name: CI/CD

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

# Cancel superseded PR runs, but never cancel a production deploy in progress.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ── CI: tests + build ─────────────────────────────────────────────────────
  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Install from the monorepo root with workspaces intact (mirrors the
      # Dockerfile) so the @medicote/shared workspace resolves; legacy-peer-deps
      # (.npmrc) clears the @ts-rest/fastify peer mismatch with fastify@5.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run tests
        run: npm test --workspace=backend

      - name: Type-check & build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  ci-gate:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Success
        run: echo "All build and test stages completed successfully!"

  # ── CD: build images + deploy (only on push to production) ─────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build from the repo root: the Dockerfiles COPY root manifests and
          # the shared/ workspace, so the context must be the monorepo root.
          context: .
          file: ${{ matrix.service }}/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Ship only the compose file to the VPS — no git checkout required on the
      # server. The .env files (root + backend/.env) live persistently on the VPS.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull images and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
