# Host nginx for analytics.medicote.me - terminates TLS (Certbot) and forwards
# everything to the in-swarm nginx published on 127.0.0.1:8080, which routes
# this hostname straight to the umami service (see infrastructure/nginx/nginx.conf).
#
# Umami must live on its own subdomain rather than a subpath of medicote.me:
# the official ghcr.io Umami image bakes its Next.js basePath in at build
# time, so a prebuilt image always assumes it's served from "/". Reverse
# proxying it under "/umami/" breaks its own asset/API requests.
#
# Setup on the VPS:
#   1. Add a DNS A/AAAA record for analytics.medicote.me pointing at this host.
#   2. Put this file at /etc/nginx/sites-available/analytics.medicote.me,
#      symlink it into sites-enabled, then run:
#        sudo certbot --nginx -d analytics.medicote.me
#      (this will rewrite the listen/ssl_certificate lines below, same as it
#      already did for deploy/nginx/medicote.me.conf).
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Also set PUBLIC_UMAMI_URL=https://analytics.medicote.me in the root .env on
# the VPS (see .env.example) and redeploy the stack so the frontend picks it
# up (no image rebuild needed, it's a runtime env var).

server {
    server_name analytics.medicote.me;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/analytics.medicote.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/analytics.medicote.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = analytics.medicote.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name analytics.medicote.me;
    return 404; # managed by Certbot
}
