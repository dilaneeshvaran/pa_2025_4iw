# Host nginx reverse proxy for medicote.me.
# Put this in /etc/nginx/sites-available/medicote.me (then symlink into
# sites-enabled) or /etc/nginx/conf.d/medicote.me.conf, then: nginx -t && systemctl reload nginx
#
# It proxies to the published container ports on localhost:
#   /      -> frontend  (127.0.0.1:3000)
#   /api/  -> backend   (127.0.0.1:3001, keeps the /api prefix)
#   /umami/-> umami      (127.0.0.1:3002, requires umami BASE_PATH=/umami)
#
# TLS certificates are managed by your existing certbot (Let's Encrypt).

# WebSocket upgrade support (Fastify @fastify/websocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name medicote.me www.medicote.me;

    # Let certbot renew via webroot if you use that mode.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medicote.me www.medicote.me;

    ssl_certificate     /etc/letsencrypt/live/medicote.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medicote.me/privkey.pem;

    # Match the backend multipart upload limit (10 MB).
    client_max_body_size 10m;

    # Backend API — keep the /api prefix (Fastify routes live under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Umami analytics (optional — needs umami BASE_PATH=/umami).
    location /umami/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Nuxt/Nitro).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
