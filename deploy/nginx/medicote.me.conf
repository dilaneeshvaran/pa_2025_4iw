# Host nginx reverse proxy for medicote.me (TLS managed by Certbot).
# Lives on the VPS, e.g. /etc/nginx/sites-available/medicote.me.
# After editing: sudo nginx -t && sudo systemctl reload nginx
#
# Routing (to the published container ports on localhost):
#   /      -> frontend (127.0.0.1:3000)
#   /api/  -> backend  (127.0.0.1:3001, keeps the /api prefix)
#
# IMPORTANT: this only routes traffic. The frontend must also be told to call
# the API on this domain — set PUBLIC_API_BASE=https://medicote.me/api in the
# VPS root .env and recreate the frontend container, otherwise it keeps calling
# the raw IP over http and the browser blocks it as mixed content.

server {
    server_name medicote.me www.medicote.me;

    # Match the backend multipart upload limit (10 MB).
    client_max_body_size 10m;

    # Backend API — keep the /api prefix (Fastify routes live under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Frontend (Nuxt/Nitro).
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/medicote.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/medicote.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.medicote.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = medicote.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name medicote.me www.medicote.me;
    return 404; # managed by Certbot
}
