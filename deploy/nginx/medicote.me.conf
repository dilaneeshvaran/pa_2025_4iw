# Host nginx for medicote.me — terminates TLS (Certbot) and forwards everything
# to the in-swarm nginx published on 127.0.0.1:8080, which routes /, /api, /umami
# to the frontend / backend / umami services.
# Put on the VPS (e.g. /etc/nginx/sites-available/medicote.me), then:
#   sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade support (Fastify @fastify/websocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name medicote.me www.medicote.me;

    # Match the backend multipart upload limit (10 MB).
    client_max_body_size 10m;

    # Forward everything to the swarm's nginx (it handles /, /api, /umami).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/medicote.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/medicote.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.medicote.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = medicote.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name medicote.me www.medicote.me;
    return 404; # managed by Certbot
}
